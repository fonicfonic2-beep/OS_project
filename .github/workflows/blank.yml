name: Build MyOS x86_64 ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cài đặt các gói cần thiết
        run: |
          sudo apt update
          sudo apt install -y nasm gcc make xorriso grub-pc-bin mtools qemu-system-x86_64

      - name: Build dự án
        run: make all

      - name: Upload file ISO
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-x86_64-ISO
          path: build/MyOS.iso
