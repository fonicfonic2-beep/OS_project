name: Build MyOS x86_64 ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cài các gói cần thiết
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y nasm gcc make binutils xorriso grub-pc-bin mtools qemu-system-x86

      - name: Liệt kê file để kiểm tra
        run: ls -la OSProject/

      - name: TẠO MỚI HOÀN TOÀN Makefile
        run: |
          cd OSProject
          cat > Makefile <<'EOF'
CC      := gcc
NASM    := nasm
LD      := ld

CFLAGS  := -ffreestanding -m64 -mno-red-zone -mcmodel=kernel -mgeneral-regs-only -Wall -Wextra
NASMFLAGS := -f elf64 -g -F dwarf
LDFLAGS := -nostdlib -T linker.ld

SRC     := src
BUILD   := build
ISODIR  := iso

C_SRC   := $(shell find $(SRC) -name "*.c")
ASM_SRC := $(shell find $(SRC) -name "*.asm")

C_OBJ   := $(patsubst $(SRC)/%.c, $(BUILD)/%.o, $(C_SRC))
ASM_OBJ := $(patsubst $(SRC)/%.asm, $(BUILD)/%.o, $(ASM_SRC))
OBJS    := $(C_OBJ) $(ASM_OBJ)

KERNEL  := $(BUILD)/kernel.bin
ISO     := $(BUILD)/MyOS.iso

.PHONY: all clean run

all: $(ISO)

$(KERNEL): $(OBJS) linker.ld
 $(LD) $(LDFLAGS) $(OBJS) -o $@

$(BUILD)/%.o: $(SRC)/%.c
 @mkdir -p $(dir $@)
 $(CC) $(CFLAGS) -c $< -o $@

$(BUILD)/%.o: $(SRC)/%.asm
 @mkdir -p $(dir $@)
 $(NASM) $(NASMFLAGS) $< -o $@

$(ISO): $(KERNEL)
 @mkdir -p $(ISODIR)/boot/grub
 cp $(KERNEL) $(ISODIR)/boot/kernel.bin
 cp grub.cfg $(ISODIR)/boot/grub/grub.cfg
 xorriso -as mkisofs -o $@ -isohybrid-mbr /usr/lib/grub/i386-pc/boot_hybrid.img -b boot/grub/i386-pc/eltorito.img -no-emul-boot -boot-load-size 4 -boot-info-table --grub2-boot-info --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img $(ISODIR)

run: $(ISO)
 qemu-system-x86_64 -cdrom $(ISO)

clean:
 rm -rf $(BUILD) $(ISODIR)
EOF

      - name: DEBUG kiểm tra TAB
        run: |
          cd OSProject
          cat -A Makefile

      - name: Chạy Build
        run: cd OSProject && make all

      - name: Tải file ISO ra
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-x86_64-ISO
          path: OSProject/build/MyOS.iso
