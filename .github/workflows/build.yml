name: Build MyOS x86_64 ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y nasm gcc make binutils xorriso grub-pc-bin mtools qemu-system-x86

      - name: List files for debug
        run: ls -la

      - name: Build ISO
        run: make

      - name: Upload ISO file
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-x86_64-ISO
          path: build/MyOS.iso
