name: Build MyOS x86_64 ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout toàn bộ source code
        uses: actions/checkout@v4

      - name: Cài các gói cần build
        run: |
          sudo apt-get install -y nasm gcc make binutils xorriso grub-pc-bin mtools qemu-system-x86

      - name: Xem danh sách file để debug
        run: ls -la OSProject/

      - name: Chạy make từ trong thư mục OSProject
        run: cd OSProject && make all

      - name: Upload file ISO
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-x86_64-ISO
          path: OSProject/build/MyOS.iso
