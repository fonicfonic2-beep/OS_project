name: Build MyOS x86_64 ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cài các gói cần thiết
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y nasm gcc make binutils xorriso grub-pc-bin mtools qemu-system-x86

      - name: Liệt kê file để kiểm tra
        run: ls -la OSProject/

      - name: Chuyển toàn bộ 8 dấu cách đầu dòng thành TAB thật
        run: |
          cd OSProject
          sed -i 's/^        /\t/g' Makefile
          sed -i 's/^    /\t/g' Makefile

      - name: DEBUG xem ký tự ẩn trong Makefile
        run: |
          cd OSProject
          cat -A Makefile

      - name: Chạy Build
        run: cd OSProject && make all

      - name: Tải file ISO ra
        uses: actions/upload-artifact@v4
        with:
          name: MyOS-x86_64-ISO
          path: OSProject/build/MyOS.iso
